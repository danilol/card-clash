name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Docker image builds (no push — deploys land in stories 4.2/4.3)
        run: docker build -t card-clash-server:ci .
      - name: Boot the image and smoke it (health + join + one round)
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://smoke@localhost:5432/smoke \
            card-clash-server:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health || { docker logs smoke; exit 1; }
          node scripts/smoke.mjs http://localhost:3000 || { docker logs smoke; exit 1; }
          docker rm -f smoke
