name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a mid-flight deploy (unlike ci.yml).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrate the production database (Neon)
        run: npm run migrate -w @card-clash/server
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Install worker glue deps (not an npm workspace)
        run: npm ci
        working-directory: deploy/cloudflare
      - name: Deploy (wrangler builds and pushes the container image)
        run: npx wrangler deploy
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
